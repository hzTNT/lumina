  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/home" aria-label="Lumina 首页">
        <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
        <span class="brand-text"><strong>LUMINA</strong><small>微光影库</small></span>
      </a>

      <nav class="nav" aria-label="主导航">
        <a class="nav-link" href="#/home" data-nav="home"><svg class="icon"><use href="#i-home"/></svg><span>首页</span></a>
        <a class="nav-link" href="#/movies" data-nav="movies"><svg class="icon"><use href="#i-film"/></svg><span>电影</span><em id="nav-movie-count"></em></a>
        <a class="nav-link" href="#/series" data-nav="series"><svg class="icon"><use href="#i-tv"/></svg><span>剧集</span><em id="nav-series-count"></em></a>
        <a class="nav-link" href="#/continue" data-nav="continue"><svg class="icon"><use href="#i-clock"/></svg><span>继续观看</span></a>
        <a class="nav-link" href="#/favorites" data-nav="favorites"><svg class="icon"><use href="#i-heart"/></svg><span>收藏</span><em id="nav-favorite-count"></em></a>
        <div class="nav-sep"></div>
        <a class="nav-link" href="#/settings" data-nav="settings"><svg class="icon"><use href="#i-settings"/></svg><span>设置</span></a>
      </nav>

      <div class="sidebar-foot">
        <div class="server-state" id="server-state">
          <span class="dot"></span>
          <div><strong id="server-state-title">正在连接…</strong><small id="server-state-sub">Lumina</small></div>
        </div>
        <a class="sidebar-link" href="#/settings">媒体目录与转码设置</a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <a class="topbar-brand" href="#/home" aria-label="Lumina 首页">
          <span class="brand-mark small"><svg class="icon"><use href="#i-logo"/></svg></span>
          <strong>LUMINA</strong>
        </a>
        <label class="search" id="search-box">
          <svg class="icon"><use href="#i-search"/></svg>
          <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="搜索电影、剧集…" aria-label="搜索">
          <kbd>/</kbd>
        </label>
        <div class="topbar-actions">
          <span class="admin-only" data-admin-only>
            <button class="status-pill" id="scan-pill" data-action="scan" title="点击重新扫描媒体库">
              <span class="dot"></span><span id="scan-label">就绪</span>
            </button>
            <button class="icon-btn" data-action="scan" title="重新扫描媒体库" aria-label="重新扫描媒体库">
              <svg class="icon"><use href="#i-refresh"/></svg>
            </button>
          </span>
          <div class="account-wrap">
            <button class="account-btn" id="account-btn" aria-haspopup="menu" aria-expanded="false">
              <span class="avatar" id="account-avatar">?</span>
              <span class="account-name" id="account-name">登录</span>
              <svg class="icon chevron"><use href="#i-chevron-right"/></svg>
            </button>
            <div class="account-menu" id="account-menu" role="menu" hidden>
              <div id="account-menu-body"></div>
            </div>
          </div>
        </div>
      </header>

      <div id="birthday-banner" class="birthday-banner" hidden></div>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <nav class="mobile-nav" id="mobile-nav" aria-label="移动端导航">
    <a href="#/home" data-nav="home"><svg class="icon"><use href="#i-home"/></svg><span>首页</span></a>
    <a href="#/movies" data-nav="movies"><svg class="icon"><use href="#i-film"/></svg><span>电影</span></a>
    <a href="#/series" data-nav="series"><svg class="icon"><use href="#i-tv"/></svg><span>剧集</span></a>
    <a href="#/favorites" data-nav="favorites"><svg class="icon"><use href="#i-heart"/></svg><span>收藏</span></a>
    <a href="#/settings" data-nav="settings"><svg class="icon"><use href="#i-settings"/></svg><span>设置</span></a>
  </nav>

  <div id="auth-overlay" class="auth-overlay" hidden>
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>
        <div><strong>LUMINA</strong><small>微光影库 · 家庭影院</small></div>
      </div>
      <div id="auth-panel" class="auth-panel"></div>
    </div>
  </div>

  <div id="player-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/hls.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
